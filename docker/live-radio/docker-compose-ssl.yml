services:
  live-radio:
    build: .
    container_name: live-radio
    restart: unless-stopped
    env_file:
      - .env
    # Expose ports only internally when using nginx proxy
    expose:
      - "8000"  # Icecast
      - "3000"  # API Server
    volumes:
      - ./audio-cache:/app/audio-cache
      - ./logs:/var/log/icecast
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - radio-network

  nginx:
    image: nginx:alpine
    container_name: live-radio-nginx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    command: >
      /bin/sh -c "envsubst '\$PUBLIC_DOMAIN' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - live-radio
    networks:
      - radio-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot
    container_name: live-radio-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - radio-network

networks:
  radio-network:
    driver: bridge
