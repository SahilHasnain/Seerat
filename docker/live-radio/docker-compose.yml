services:
  live-radio:
    build: .
    container_name: live-radio
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
      - "3000"
    environment:
      - CLEAR_AUDIO_CACHE_ON_START=${CLEAR_AUDIO_CACHE_ON_START:-false}
    volumes:
      - ./audio-cache:/app/audio-cache
      - ./logs:/var/log/icecast
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - radio-network

  nginx:
    image: nginx:alpine
    container_name: live-radio-nginx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    command: >
      /bin/sh -c "if [ -n \"$${PUBLIC_DOMAIN}\" ] && [ -f \"/etc/letsencrypt/live/$${PUBLIC_DOMAIN}/fullchain.pem\" ] && [ -f \"/etc/letsencrypt/live/$${PUBLIC_DOMAIN}/privkey.pem\" ]; then
      envsubst '$${PUBLIC_DOMAIN}' < /etc/nginx/templates/nginx-ssl.conf.template > /etc/nginx/nginx.conf;
      else
      cp /etc/nginx/templates/nginx-http-only.conf /etc/nginx/nginx.conf;
      fi
      && nginx -g 'daemon off;'"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/templates/nginx-ssl.conf.template:ro
      - ./nginx-http-only.conf:/etc/nginx/templates/nginx-http-only.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - live-radio
    networks:
      - radio-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot
    container_name: live-radio-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - radio-network

networks:
  radio-network:
    driver: bridge
