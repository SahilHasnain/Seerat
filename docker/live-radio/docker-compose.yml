services:
  live-radio:
    build: .
    container_name: live-radio
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000" # Icecast
      - "8080:3000" # API Server
    environment:
      - CLEAR_AUDIO_CACHE_ON_START=${CLEAR_AUDIO_CACHE_ON_START:-false}
    volumes:
      - ./audio-cache:/app/audio-cache
      - ./logs:/var/log/icecast
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
